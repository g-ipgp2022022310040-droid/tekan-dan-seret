},{passive:false});

}

/* Muzik instrumental asal: melodi lembut, kord dan bes disintesis setempat.
   Satu sumber gelung dikekalkan sepanjang latihan dan semua soalan.
   Butang muzik hanya mengubah gain muzik; kesan jawapan kekal berfungsi. */
const audio={ctx:null,musicGain:null,source:null,started:false,
 ensure(){
  try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.musicGain=this.ctx.createGain();this.musicGain.gain.value=0;this.musicGain.connect(this.ctx.destination);}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return true;}catch(_){return false;}
 },
 compose(){
  const ctx=this.ctx,rate=22050,beat=.625,duration=40,buffer=ctx.createBuffer(1,rate*duration,rate),data=buffer.getChannelData(0);
  const melodies=[[76,79,81,79],[76,74,72,74],[76,79,83,81],[79,76,74,72],[77,81,84,81],[79,77,76,74],[76,79,81,79],[76,74,72,72]],chords=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
  function note(m,start,length,amp,soft=false){const f=440*2**((m-69)/12),first=Math.round(start*rate),count=Math.round(length*rate);for(let j=0;j<count&&first+j<data.length;j++){const t=j/rate,envelope=Math.min(1,t/.035)*Math.min(1,Math.max(0,(length-t)/.18))*Math.exp(-t*(soft?1.15:2.8));data[first+j]+=amp*envelope*(Math.sin(2*Math.PI*f*t)+.12*Math.sin(4*Math.PI*f*t)+.025*Math.sin(6*Math.PI*f*t));}}
  for(let bar=0;bar<16;bar++){const start=bar*4*beat;melodies[bar%8].forEach((m,i)=>note(m,start+i*beat,beat*1.3,.26));chords[bar%4].forEach(m=>note(m,start,beat*3.95,.05,true));note(chords[bar%4][0]-12,start,beat*1.8,.07,true);note(chords[bar%4][0]-12,start+2*beat,beat*1.8,.055,true);}
  const fade=300;for(let i=0;i<fade;i++){data[i]*=i/fade;data[data.length-i-1]*=i/fade;}return buffer;
 },
 start(){if(!this.ensure())return;this.started=true;if(!this.source){this.source=this.ctx.createBufferSource();this.source.buffer=this.compose();this.source.loop=true;this.source.connect(this.musicGain);this.source.start();}this.update();},
 update(){if(this.musicGain)this.musicGain.gain.setTargetAtTime((this.started && musicEnabled) ? .28 : 0,this.ctx.currentTime,.09);},
 effect(correct){
  if(!this.ensure())return;const now=this.ctx.currentTime;
  const tones=correct?[[659.25,0,.15],[880,.13,.22]]:[[349.23,0,.15],[293.66,.12,.19]];
  tones.forEach(([frequency,delay,length])=>{const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=correct?'triangle':'sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(0,now+delay);gain.gain.linearRampToValueAtTime(correct ? .15 : .13,now+delay+.018);gain.gain.exponentialRampToValueAtTime(.001,now+delay+length);osc.connect(gain);gain.connect(this.ctx.destination);osc.start(now+delay);osc.stop(now+delay+length+.02);osc.onended=()=>{osc.disconnect();gain.disconnect();};});
 },
 endSession(){this.started=false;this.update();if(this.source){try{this.source.stop();}catch(_){}this.source.disconnect();this.source=null;}}
};
$('#musicBtn').addEventListener('click',()=>{musicEnabled=!musicEnabled;$('#musicBtn').setAttribute('aria-pressed',String(musicEnabled));$('#musicBtn').setAttribute('aria-label',musicEnabled?'Muzik hidup. Tekan untuk memadamkan muzik.':'Muzik padam. Tekan untuk menghidupkan muzik.');$('#musicLabel').textContent='Muzik: '+(musicEnabled?'Hidup':'Padam');if(state.screen!=='intro')audio.ensure();audio.update();});
document.addEventListener('visibilitychange',()=>{if(!audio.ctx)return;if(document.hidden){cancelDrag();audio.ctx.suspend().catch(()=>{});}else if(audio.started)audio.ctx.resume().catch(()=>{});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cancelDrag();state.tapChoice=null;updatePlacement();}});
resetState();renderIntro();
</script>
